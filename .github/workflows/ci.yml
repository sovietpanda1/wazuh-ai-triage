name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JSON files
        run: for f in workflows/*.json samples/*.json samples/alerts/*.json; do python -m json.tool "$f" > /dev/null || exit 1; done
      - name: Lint shell scripts
        run: shellcheck wazuh/install-integration.sh wazuh/integrations/custom-n8n
      - name: Unit tests
        run: python -m unittest discover -s tests -v
