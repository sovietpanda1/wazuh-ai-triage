name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24" # the Node version n8n 2.x runs on
      - name: Validate JSON files
        run: for f in workflows/*.json samples/*.json samples/alerts/*.json tests/fixtures/*.json; do python -m json.tool "$f" > /dev/null || exit 1; done
      - name: Workflow export matches workflows/src
        run: python scripts/build_workflow.py --check
      - name: Lint shell scripts
        run: shellcheck wazuh/install-integration.sh wazuh/integrations/custom-n8n
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Installer sandbox tests (need root)
        run: sudo "$(which python)" -m unittest tests.test_installer -v
      - name: JavaScript unit tests (Code node logic)
        run: node --test "tests/js/*.test.js"

  e2e:
    name: End-to-end on real n8n (mock LLM / AbuseIPDB / Telegram)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the workflow in n8n's Docker image
        run: python tests/e2e/run_e2e.py --docker
        timeout-minutes: 15

  secrets:
    name: Secret scan (whole history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source=/repo --redact -v
